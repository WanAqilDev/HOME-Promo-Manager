<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HPM — Enrollment Modal Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --hpm-pink:      #f02d7d;
  --hpm-pink-dark: #b5115a;
  --hpm-lime:      #5cbf2a;
  --hpm-lime-dark: #3d9a18;
  --hpm-orange:    #f5821f;
  --hpm-navy:      #0d2b6e;
}

body {
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(180deg, #c2e8f8 0%, #d9f0fb 55%, #b0ddf0 100%) fixed;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

/* ─── DEMO STAGE ──────────────────────── */
.demo-stage {
  max-width: 560px;
  width: 100%;
  text-align: center;
}
.demo-label {
  font-family: 'Fredoka One', cursive;
  font-size: .75em;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--hpm-navy);
  opacity: .35;
  margin-bottom: 20px;
}
.demo-controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 32px;
}
.demo-btn {
  font-family: 'Nunito', sans-serif;
  font-size: .82em;
  font-weight: 700;
  padding: 8px 18px;
  border-radius: 20px;
  border: 2px solid var(--hpm-navy);
  background: transparent;
  color: var(--hpm-navy);
  cursor: pointer;
  transition: all .2s ease;
}
.demo-btn:hover    { background: var(--hpm-navy); color: #fff; }
.demo-btn.active   { background: var(--hpm-pink); border-color: var(--hpm-pink); color: #fff; }
.demo-btn.lime     { border-color: var(--hpm-lime); color: var(--hpm-lime-dark); }
.demo-btn.lime:hover { background: var(--hpm-lime); color: #fff; border-color: var(--hpm-lime); }

.demo-note {
  font-size: .78em;
  color: var(--hpm-navy);
  opacity: .45;
  font-weight: 600;
  margin-top: 14px;
}

/* ─── OVERLAY ──────────────────────────── */
#hpm-enroll-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(13, 43, 110, .75);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
#hpm-enroll-overlay.hpm-show {
  display: flex;
  animation: hpmFadeIn .3s ease-out both;
}
@keyframes hpmFadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* ─── CARD ─────────────────────────────── */
.hpm-enroll-card {
  background: #fff;
  border-radius: 24px;
  padding: 28px 24px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  box-shadow: 0 8px 28px rgba(13, 43, 110, .18);
  position: relative;
  animation: hpmPopIn .5s cubic-bezier(.34, 1.56, .64, 1) both;
}
@keyframes hpmPopIn {
  from { transform: scale(.85); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}

/* Logo */
.hpm-enroll-logo {
  height: 40px;
  margin-bottom: 16px;
  display: block;
  margin-left: auto;
  margin-right: auto;
}

/* Success icon */
.hpm-enroll-icon {
  width: 60px; height: 60px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: linear-gradient(135deg, #5cbf2a, #3d9a18);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fredoka One', cursive;
  font-size: 1.8em; color: #fff;
  box-shadow: 0 4px 14px rgba(92, 191, 42, .35);
  animation: hpmIconBounce .6s cubic-bezier(.34, 1.56, .64, 1) .1s both;
}
@keyframes hpmIconBounce {
  0%   { transform: scale(.5);  opacity: 0; }
  70%  { transform: scale(1.1); }
  100% { transform: scale(1);   opacity: 1; }
}

/* Title */
.hpm-enroll-title {
  font-family: 'Fredoka One', cursive;
  font-size: 1.4em;
  color: var(--hpm-navy);
  line-height: 1.4;
  margin: 0 0 12px;
}

/* Category badge */
.hpm-enroll-badge {
  display: inline-flex;
  color: #fff;
  padding: 4px 14px;
  border-radius: 12px;
  font-family: 'Nunito', sans-serif;
  font-size: .75em;
  font-weight: 700;
  margin-bottom: 16px;
}

/* Code area */
.hpm-enroll-code-label {
  display: block;
  font-family: 'Nunito', sans-serif;
  font-size: .85em;
  font-weight: 700;
  color: var(--hpm-navy);
  opacity: .6;
  margin: 12px 0 8px;
}
.hpm-enroll-code-pill {
  display: inline-flex;
  background: var(--hpm-pink);
  color: #fff;
  font-family: 'Fredoka One', cursive;
  font-size: 2.2em;
  padding: 12px 28px;
  border-radius: 20px;
  box-shadow: 0 4px 14px rgba(240, 45, 125, .35);
  letter-spacing: .05em;
  margin: 8px 0;
}

/* Campaign + date */
.hpm-enroll-campaign {
  display: block;
  font-family: 'Nunito', sans-serif;
  font-size: .8em;
  font-weight: 700;
  color: var(--hpm-navy);
  opacity: .5;
  margin-top: 8px;
}
.hpm-enroll-date {
  display: block;
  font-family: 'Nunito', sans-serif;
  font-size: .78em;
  font-weight: 600;
  color: var(--hpm-navy);
  opacity: .4;
  margin: 4px 0 20px;
}

/* Dismiss button */
.hpm-enroll-dismiss {
  border: 2px solid var(--hpm-navy);
  background: transparent;
  color: var(--hpm-navy);
  padding: 10px 28px;
  border-radius: 20px;
  font-family: 'Nunito', sans-serif;
  font-size: .9em;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s ease;
}
.hpm-enroll-dismiss:hover { background: var(--hpm-navy); color: #fff; }

/* ─── RESPONSIVE ───────────────────────── */
@media (min-width: 768px) {
  .hpm-enroll-card    { padding: 36px 32px; }
  .hpm-enroll-icon    { width: 80px; height: 80px; font-size: 2.2em; }
  .hpm-enroll-title   { font-size: 1.7em; }
  .hpm-enroll-code-pill { font-size: 2.8em; padding: 16px 32px; }
}
</style>
</head>
<body>

<!-- ── DEMO STAGE ─────────────────────── -->
<div class="demo-stage">
  <div class="demo-label">Enrollment Modal — Design Preview</div>

  <div class="demo-controls">
    <button class="demo-btn active" onclick="showModal('new','6CURE','PROMO SIX-CURE','5 Jun 2026, 10:32 am')">
      Kategori: Baru
    </button>
    <button class="demo-btn" onclick="showModal('diagnosed','DIAGNOS33','PROMO SIX-CURE','5 Jun 2026, 11:08 am')">
      Kategori: Diagnos
    </button>
    <button class="demo-btn" onclick="showModal('reactivation','REACT33','PROMO SIX-CURE','5 Jun 2026, 09:55 am')">
      Kategori: Reaktivasi
    </button>
    <button class="demo-btn lime" onclick="showModal('new','MANUAL01','PROMO SIX-CURE','5 Jun 2026, 14:20 pm')">
      Kod Manual
    </button>
  </div>

  <p class="demo-note">
    Klik butang di atas untuk pratonton modal dengan kategori berbeza.<br>
    Tekan <strong>Tutup</strong> atau <strong>ESC</strong> untuk menutup.
  </p>
</div>

<!-- ── ENROLLMENT MODAL ───────────────── -->
<div id="hpm-enroll-overlay">
  <div class="hpm-enroll-card">

    <img class="hpm-enroll-logo" src="assets/poster/logo_home.png" alt="HOME">

    <div class="hpm-enroll-icon">✓</div>

    <p class="hpm-enroll-title">Tahniah! Klien berjaya<br>didaftarkan dengan promo.</p>

    <span class="hpm-enroll-badge" id="hpm-badge"></span>

    <span class="hpm-enroll-code-label">Kod Promo</span>
    <div class="hpm-enroll-code-pill" id="hpm-code">6CURE</div>

    <span class="hpm-enroll-campaign" id="hpm-campaign">PROMO SIX-CURE</span>
    <span class="hpm-enroll-date" id="hpm-enrolled-at">Didaftarkan: 5 Jun 2026, 10:32 am</span>

    <button class="hpm-enroll-dismiss" id="hpm-enroll-close">Tutup</button>

  </div>
</div>

<script>
var CATEGORY_COLORS = {
  'new':          '#3b82f6',
  'diagnosed':    '#f59e0b',
  'reactivation': '#8b5cf6'
};
var CATEGORY_LABELS = {
  'new':          'Baru',
  'diagnosed':    'Diagnos',
  'reactivation': 'Reaktivasi'
};

function showModal(category, code, campaign, date) {
  var overlay    = document.getElementById('hpm-enroll-overlay');
  var badge      = document.getElementById('hpm-badge');
  var codeEl     = document.getElementById('hpm-code');
  var campaignEl = document.getElementById('hpm-campaign');
  var dateEl     = document.getElementById('hpm-enrolled-at');

  badge.textContent        = CATEGORY_LABELS[category] || category;
  badge.style.background   = CATEGORY_COLORS[category] || '#6b7280';
  codeEl.textContent       = code;
  campaignEl.textContent   = campaign;
  dateEl.textContent       = 'Didaftarkan: ' + date;

  // Re-trigger animations by re-inserting the card
  var card = overlay.querySelector('.hpm-enroll-card');
  card.style.animation = 'none';
  card.offsetHeight; // reflow
  card.style.animation = '';

  var icon = overlay.querySelector('.hpm-enroll-icon');
  icon.style.animation = 'none';
  icon.offsetHeight;
  icon.style.animation = '';

  overlay.classList.add('hpm-show');
}

document.getElementById('hpm-enroll-close').addEventListener('click', function () {
  document.getElementById('hpm-enroll-overlay').classList.remove('hpm-show');
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    document.getElementById('hpm-enroll-overlay').classList.remove('hpm-show');
  }
});

// Auto-open on load with default state
window.addEventListener('DOMContentLoaded', function () {
  showModal('new', '6CURE', 'PROMO SIX-CURE', '5 Jun 2026, 10:32 am');
});
</script>
</body>
</html>
