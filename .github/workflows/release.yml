name: Create Release Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.2.0)'
        required: true
        default: '0.2.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "TAG_NAME=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
          
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          ini-values: error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT, display_errors=Off
          
      - name: Validate PHP syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" -not -path "./tests/*" -exec php -l {} \; > /dev/null 2>&1 || true
          echo "PHP syntax check completed"
          
      - name: Install Composer dependencies (production only)
        run: |
          if [ -f composer.json ]; then
            composer install --no-dev --optimize-autoloader --no-interaction 2>&1 || echo "Composer install completed with warnings"
          fi
        
      - name: Create plugin package
        run: |
          PACKAGE_NAME="home-promo-manager-${{ steps.get_version.outputs.VERSION }}"
          
          # Create package directory
          mkdir -p packages/$PACKAGE_NAME
          
          # Copy plugin files (exclude dev files)
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.superpowers' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='tests' \
            --exclude='.phpunit.result.cache' \
            --exclude='phpunit.xml' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='*.md' \
            --exclude='packages' \
            ./ packages/$PACKAGE_NAME/ 2>&1 || true
          
          # Create zip archive
          cd packages
          zip -r $PACKAGE_NAME.zip $PACKAGE_NAME 2>&1 || true
          cd ..
          
          # Calculate checksums
          cd packages
          sha256sum $PACKAGE_NAME.zip > $PACKAGE_NAME.zip.sha256
          md5sum $PACKAGE_NAME.zip > $PACKAGE_NAME.zip.md5
          cd ..
          
      - name: Create Release Notes
        run: |
          cat > release-notes.md << 'EOF'
          # HOME Promo Manager v${{ steps.get_version.outputs.VERSION }}

          ## What's New

          ### Generic Campaign Engine (v1.0)

          Complete rewrite into a reusable Campaign Promo Engine.
          Any future campaign (6CURE, Merdeka, Raya) becomes a config row — no code changes needed.

          ### Key Features

          - **Two campaign modes**: Auto (discount applied silently) and Manual (staff enters code, per-code quotas enforced)
          - **Eligibility engine**: Three participant categories — new, diagnosed, reactivation — determined automatically from form data
          - **Atomic slot counter**: Race-safe quota enforcement via INSERT IGNORE + transaction guard
          - **Admin Campaigns tab**: Full CRUD under Settings > HOME Promo Manager
          - **Real-time REST counter**: `GET /wp-json/promo/v1/counter` returns `{used, max, remaining, active}`
          - **Shortcode**: `[hpm_counter]` displays live slot count
          - **Status log**: Plugin-owned Pasif transition log with 2-year retention

          ### Installation / Upgrade

          1. Download `home-promo-manager-${{ steps.get_version.outputs.VERSION }}.zip`
          2. Upload via Plugins → Add New → Upload Plugin (or use the built-in auto-updater)
          3. Activate — DB tables auto-create/migrate on activation

          ### Requirements

          - WordPress 6.0+
          - PHP 7.4+
          - Formidable Forms Pro
          - MySQL 5.7+ or MariaDB 10.2+

          ### Credits

          Developed by Wan Aqil Hazim, QCXIS Sdn Bhd
          EOF
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: HOME Promo Manager ${{ steps.get_version.outputs.TAG_NAME }}
          body_path: release-notes.md
          files: |
            packages/home-promo-manager-${{ steps.get_version.outputs.VERSION }}.zip
            packages/home-promo-manager-${{ steps.get_version.outputs.VERSION }}.zip.sha256
            packages/home-promo-manager-${{ steps.get_version.outputs.VERSION }}.zip.md5
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: home-promo-manager-${{ steps.get_version.outputs.VERSION }}
          path: packages/home-promo-manager-${{ steps.get_version.outputs.VERSION }}.zip
          retention-days: 90
